<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <!-- A margin table: two outer groups, each spanning two detail rows and its
       subtotal row, above a grand-total row. tools/logo/render-logo.R
       rasterises this file to man/figures/logo.png. -->
  <path d="M100 4 L196 59.4 L196 170.6 L100 226 L4 170.6 L4 59.4 Z" fill="#14171c" stroke="#c2b28f" stroke-width="6"/>
  <g>
    <!-- outer group: spans its two detail rows and the subtotal row -->
    <rect x="46" y="53" width="33.33" height="42" rx="2.5" fill="#474c55"/>
    <rect x="46" y="101" width="33.33" height="42" rx="2.5" fill="#474c55"/>
    <!-- inner group and value columns: detail, detail, subtotal -->
    <g fill="#262a31">
      <rect x="82.33" y="53" width="33.33" height="12" rx="2.5"/>
      <rect x="82.33" y="68" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="53" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="68" width="33.33" height="12" rx="2.5"/>
      <rect x="82.33" y="101" width="33.33" height="12" rx="2.5"/>
      <rect x="82.33" y="116" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="101" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="116" width="33.33" height="12" rx="2.5"/>
    </g>
    <g fill="#a2a5aa">
      <rect x="82.33" y="83" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="83" width="33.33" height="12" rx="2.5"/>
      <rect x="82.33" y="131" width="33.33" height="12" rx="2.5"/>
      <rect x="120.67" y="131" width="33.33" height="12" rx="2.5"/>
    </g>
    <!-- grand total: both group columns merged, value kept separate -->
    <rect x="46" y="149" width="69.67" height="15" rx="2.5" fill="#c2b28f"/>
    <rect x="120.67" y="149" width="33.33" height="15" rx="2.5" fill="#c2b28f"/>
  </g>
  <text x="100" y="189" fill="#e6e1d6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle">marginplyr</text>
</svg>
