name: Set up stable Quarto
description: Install stable Quarto through the GitHub release asset API.
runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      uses: quarto-dev/quarto-actions/setup@v2
    - if: runner.os != 'Windows'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
      env:
        GH_TOKEN: ${{ github.token }}
