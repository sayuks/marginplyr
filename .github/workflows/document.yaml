# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: document.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Use the current stable Quarto and only its bundled Pandoc. The
      # executable versions deliberately float together; the diagnostic below
      # records both when their writer output changes.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::devtools, local::.
          install-pandoc: false

      - name: Record README renderer versions
        run: |
          quarto_version=$(quarto --version)
          pandoc_version=$(quarto pandoc --version | head -n 1)
          echo "Quarto ${quarto_version}"
          echo "${pandoc_version}"
          {
            echo '### README renderer'
            echo "- Quarto: \`${quarto_version}\`"
            echo "- Bundled Pandoc: \`${pandoc_version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      # README.md is generated from README.qmd the same way, and it is read
      # further than any other generated file here: GitHub shows it, and the
      # website's home page includes it. `.Rbuildignore` keeps the source out
      # of the tarball, so nothing a check run can reach says what the
      # generated file was supposed to contain, and an installation
      # instruction edited into one half alone is invisible until a reader
      # follows it.
      #
      # Both regenerations run before either check, because this one writes
      # into `man/` as well: `README.qmd` sets `fig.path` to
      # `man/figures/README-`, so a figure chunk added later produces a file
      # the check below does not look at and the `man/` check would already
      # have passed.
      - name: Regenerate README.md
        run: devtools::build_readme(quiet = TRUE)
        shell: Rscript {0}

      # The committed help pages and NAMESPACE must be what the roxygen
      # comments produce. A diff here means one of them was edited by hand or
      # left stale; regenerate with `roxygen2::roxygenise()` and commit that.
      #
      # NAMESPACE is included because a forgotten regeneration after adding
      # `@export` is otherwise silent: `devtools::test()` loads the package
      # with `export_all = TRUE`, so the missing export never fails a test,
      # and `R CMD check` only rejects exports of objects that do not exist.
      - name: Check man/ and NAMESPACE are up to date
        run: git diff --exit-code man/ NAMESPACE

      # The diff is shown, and then what it might mean: a byte comparison of
      # rendered Markdown can fail because the source/output is stale or
      # because the current stable Quarto changed its bundled Pandoc or writer
      # output. The recorded versions make those cases distinguishable.
      - name: Check README.md is up to date
        run: |
          if git diff --exit-code README.md; then
            exit 0
          fi
          quarto_version=$(quarto --version)
          pandoc_version=$(quarto pandoc --version | head -n 1)
          echo "::error::README.md is not what README.qmd renders with latest stable Quarto ${quarto_version} and its bundled ${pandoc_version}. This can mean README.md is stale, or that a newer Quarto changed its bundled Pandoc or Markdown writer output. Run devtools::build_readme() with the current stable Quarto and commit README.md."
          exit 1
