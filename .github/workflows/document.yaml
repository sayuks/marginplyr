# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: document.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, local::.
          needs: roxygen2

      - name: Regenerate documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      # The committed help pages must be what the roxygen comments produce.
      # A diff here means `man/` was edited by hand or left stale; regenerate
      # it with `roxygen2::roxygenise()` and commit the result.
      - name: Check man/ is up to date
        run: git diff --exit-code man/
