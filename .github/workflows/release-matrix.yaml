# Release gates for the source tarball.
#
# `R-CMD-check.yaml` checks a fully provisioned working tree, which is the
# right signal while developing but cannot answer two release questions: are
# the Suggested packages genuinely optional, and does each supported backend
# actually execute? This workflow answers both against one built tarball --
# the artifact a submission would carry -- so that nothing here can pass
# because of a file that exists only in the development tree. The one job that
# reads the working tree instead is `structure`, and the reason it can is that
# it asserts a property of the tests as written rather than of what ships.
#
# The jobs divide the work:
#
#   structure      runs the suite once per optional backend with the others
#                  simulated absent, and fails unless every test executes in at
#                  least one of those configurations.
#   backend-matrix generates the `backend` matrix below from the one table in
#                  `tests/testthat/helper-optional-backends.R`.
#   build          produces the single tarball every other job checks.
#   depends-only   rebuilds examples, tests, and vignettes with Suggested
#                  packages withheld (`_R_CHECK_DEPENDS_ONLY_=true`).
#   tarball        checks that tarball on R release, devel, and oldrel.
#   backend        one generated job per optional backend, each executing that
#                  backend's live behavior with the others genuinely absent.
#
# Optional backends skip in `depends-only` and `tarball`, which is what a
# minimal CRAN flavor does. That is only acceptable because the `backend` jobs
# prove the same contracts, and those jobs set `MARGINPLYR_REQUIRED_SUGGESTS`
# so that a backend which failed to install fails the job instead of skipping
# into a false green. See `tests/testthat/helper-optional-backends.R`.
#
# Which contracts those jobs prove is settled by construction rather than by a
# list (#93). Every `backend` job installs one optional backend -- plus the
# companions its entry declares, which may themselves be tracked entries when
# one drags another in -- and withholds everything else, so between them they
# execute every test that requires at most one backend; a test requiring two is
# executed by none of them and skips in all of them, unnoticed. Three layers
# close that, and no one of them is enough:
#
#   Structure    `structure`, against the working tree. Every test executes in
#                some single-backend configuration and asserts something there.
#   Environment  the `backend` jobs. The backend works when the others are
#                genuinely absent, rather than merely hidden from the guards.
#   Soundness    `verify-backend.R`, inside each `backend` job. The suite
#                started, passed something, failed nothing, and every skip
#                names a backend that job withheld.
#
# The soundness layer is what a `proves` list of contract test names used to
# approximate. It is strictly stronger: a skip for any other reason -- a stray
# `skip_if()`, a `skip_on_os()`, or `NOT_CRAN` being dropped so the snapshot
# tests skip -- now fails the job, and none of those was caught before.
#
# `structure` stands outside the tarball scheme deliberately. It asks about the
# tests as written, so a built tarball would add a build step and a `needs`
# without changing the answer, and it is the one gate here an agent can run
# before pushing: `Rscript .github/scripts/verify-suite-coverage.R` gives the
# same verdict locally that the job gives in CI.
#
# Snapshot expectations run only where `NOT_CRAN` is set: testthat skips them
# under CRAN semantics, so a snapshot never fails in a job that emulates CRAN.
# That is the `backend` jobs, which set it in the workflow, and the `structure`
# job, whose script sets it so a local run matches CI. `structure` takes no
# `needs`, so in practice it is the first job to report a stale snapshot -- but
# it runs against the working tree, and a `backend` job is still what proves
# the snapshot inside `R CMD check`.
#
# The `backend` matrix is generated rather than written out because every field
# in it was a restatement of the same table -- which package to install, which
# absence must fail the job, what to call the cache. The cost is that this file
# no longer shows its own jobs, which `backend-matrix` pays back by writing the
# matrix it produced to the step summary.
#
# Which packages a job installs is therefore the whole signal, and the
# dependency cache is what nearly took it away. `setup-r-dependencies@v2` falls
# back to a `restore-keys` prefix of `<os>-<R version>-<arch>-<cache-version>-`
# when its exact key misses, so every job sharing a `cache-version` also shares
# a library: while all four jobs here and `R-CMD-check.yaml` used
# `cache-version: 3`, the fully provisioned library was restored into the jobs
# documented as running without it, and pak installed only the remainder on top
# (#64). The fix is a `cache-version` per dependency request rather than
# `cache: false`, because these jobs still want a warm cache and losing it
# would cost every run an install of the hard dependency closure; what they
# cannot tolerate is sharing one with a differently provisioned job. The names
# say which request they stand for:
#
#   full-1              hard dependencies plus every Suggest, and the package
#                       itself (`build`, `structure`, and `R-CMD-check.yaml`).
#   hard-1              hard dependencies plus rcmdcheck, testthat, and quarto
#                       (`depends-only` and `tarball`).
#   backend-<name>-1    hard dependencies plus rcmdcheck and testthat, and
#                       exactly one optional backend plus its companions
#                       (`backend`). Derived per entry by
#                       `generate-backend-matrix.R`, so a backend added to the
#                       table cannot arrive sharing another's library. No
#                       quarto: these jobs run `--ignore-vignettes`.
#
# A cache key is not self-checking -- a mistake in one produces a green run
# that reads like a correct one -- so `verify-library-isolation.R` asserts the
# library each job got before its check runs. `check-tarball.R` sources it, so
# every job that checks the tarball makes that assertion and no job can drop it
# while still claiming to check anything. Renaming a `cache-version` is safe.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: release-matrix.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  # `--as-cran` otherwise queries CRAN on every run. That adds network
  # flakiness and NOTEs about clock skew or momentarily unreachable URLs which
  # say nothing about the change under test, and each one would be annotated as
  # unexpected. Local incoming checks still run; the remote ones belong to the
  # pre-submission `rhub.yaml` run, where a human is reading the result.
  _R_CHECK_CRAN_INCOMING_REMOTE_: false

jobs:
  # Every test executes in some single-backend configuration. Proving it needs
  # the whole suite run once per backend with the others withheld, which the
  # `backend` jobs cannot answer between them: each reports its own green, and
  # a test that skipped in every one of them leaves a green behind for each.
  #
  # So this simulates every configuration in one job, through
  # `MARGINPLYR_HIDE_SUGGESTS`. Simulated rather than aggregated from the real
  # jobs' artifacts for one reason: an agent can run it before pushing. A guard
  # is the only thing that decides whether a test skips and the hook drives the
  # guards, so the structural answer is the one those jobs would give; what
  # a simulation cannot answer -- whether a backend works when the others are
  # genuinely gone -- is what those jobs remain for.
  #
  # It takes no `needs` and downloads no tarball, because the property is about
  # the tests as written. Failing before `build` finishes is the point.
  #
  # It shares `full-1` with `build` by making the identical dependency request.
  # That is consistent with the isolation scheme rather than an exemption to it:
  # the scheme separates jobs that claim an optional backend is absent, and this
  # job claims the opposite -- it needs all of them installed, and
  # `verify-suite-coverage.R` stops if any is missing rather than reporting a
  # vacuous pass.
  structure:
    name: Suite coverage by construction
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
          cache-version: full-1

      - name: Verify every test executes in some backend configuration
        run: Rscript .github/scripts/verify-suite-coverage.R

  # The `backend` jobs below are one job body repeated per optional backend, and
  # every field that differed between them was a restatement of
  # `optional_suggest_spec()`. This job derives them from it instead, so a
  # backend cannot be tracked by the tests and executed by nothing: the job is
  # the table. That is what retired the `coverage` job, which existed only to
  # read this file back against the same list (#71).
  #
  # No `needs`, and no dependency install through `setup-r-dependencies`: it
  # reads the checkout and writes JSON, so it has no `cache-version` and stands
  # outside the isolation scheme above.
  backend-matrix:
    name: Generate the backend matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      backend: ${{ steps.generate.outputs.backend }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the JSON serializer
        run: install.packages("jsonlite")
        shell: Rscript {0}

      - name: Generate the backend matrix
        id: generate
        run: Rscript .github/scripts/generate-backend-matrix.R

  build:
    name: Build source tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # The vignette engine is the quarto R package, which shells out to the
      # Quarto CLI named in DESCRIPTION's SystemRequirements. Install it here
      # rather than assuming the runner image ships one.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Quarto renders vignettes in a child R process that cannot see the
          # temporary installation R CMD build makes, so install the package
          # itself as well.
          extra-packages: local::.
          needs: check
          # Provisioned on purpose: this job builds the tarball, and vignette
          # sources exercise the optional backends. Shared with
          # `R-CMD-check.yaml`, which asks for the same set plus rcmdcheck.
          # Sharing a prefix with a superset is safe here because neither job
          # claims any package is absent; that claim is what the other
          # `cache-version` values protect.
          cache-version: full-1

      - name: Build source tarball
        run: |
          mkdir tarball
          R CMD build .
          mv marginplyr_*.tar.gz tarball/

      - name: Record the tarball contents
        run: |
          tarball=$(ls tarball/marginplyr_*.tar.gz)
          echo "## Source tarball" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l "$tarball" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "$tarball" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: tarball/marginplyr_*.tar.gz
          retention-days: 7
          if-no-files-found: error

  depends-only:
    name: Minimal dependencies (depends-only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Withholds Suggested packages from examples, tests, and vignettes.
      _R_CHECK_DEPENDS_ONLY_: true
      # Without this, `--as-cran` treats the deliberately absent Suggests as a
      # check failure, which would make the job impossible to run.
      _R_CHECK_FORCE_SUGGESTS_: false
      MARGINPLYR_CHECK_LABEL: Minimal dependencies (depends-only)

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs only what DESCRIPTION declares as a hard dependency, plus the
      # test harness and the declared VignetteBuilder. R CMD check makes the
      # VignetteBuilder visible while rebuilding vignettes even in
      # depends-only mode, so quarto here does not weaken the gate; every
      # optional backend stays absent, and `verify-depends-only.R` fails the
      # job if one turns out not to be.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::quarto
          cache-version: hard-1

      - uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: tarball

      # Stops before checking anything if the restored cache carried an
      # optional backend in; see `verify-library-isolation.R`.
      # `verify-depends-only.R` below proves the same absence from the tests'
      # own skip lines, which is a different question: a library can be clean
      # while the suite never starts.
      - name: Check the tarball without Suggested packages
        run: Rscript .github/scripts/check-tarball.R

      # Runs even when the check failed: if a Suggested package leaked into the
      # library, that leak is the most useful thing to report, and skipping the
      # step would leave only the downstream symptom.
      - name: Verify the minimal-dependency run proved something
        if: always()
        run: Rscript .github/scripts/verify-depends-only.R

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-depends-only
          path: check
          retention-days: 7

  tarball:
    name: Tarball ${{ matrix.config.os }} (${{ matrix.config.r }})
    needs: build
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      # Optional backends are deliberately absent from this matrix -- asserted
      # by `check-tarball.R`, not merely intended -- and the dedicated
      # `backend` jobs execute them. Without this, `--as-cran` would fail the
      # job for the missing Suggests rather than let the tests skip.
      _R_CHECK_FORCE_SUGGESTS_: false
      MARGINPLYR_CHECK_LABEL: >-
        Tarball ${{ matrix.config.os }} (${{ matrix.config.r }})

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Keeping this to hard dependencies plus the test harness and
      # VignetteBuilder is what lets R-devel join the matrix without the
      # binary-repository workaround `R-CMD-check.yaml` needs. P3M publishes no
      # binaries for the development series, so on R-devel pak builds this
      # whole set from source; that is affordable because the two packages
      # whose source builds are not are arrow and duckdb, which are Suggests
      # and so are never requested here. The measurement is in
      # `investigation/github-actions-modernization.md`.
      #
      # That is a claim about which packages this job installs, and
      # `check-tarball.R` is what checks it: while this job shared a
      # `cache-version` with the provisioned matrix it was in fact receiving
      # arrow and duckdb from the restored cache (#64).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::quarto
          cache-version: hard-1

      - uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: tarball

      - name: Check the tarball
        run: Rscript .github/scripts/check-tarball.R

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-tarball-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
          retention-days: 7

  # Ubuntu at R release only. Each job's value is isolation -- one backend
  # installed, everything else absent -- not platform breadth, and multiplying
  # that by three operating systems would quadruple the cost of the workflow
  # for a weaker signal. macOS and Windows still exercise every backend
  # together in the fully provisioned `R-CMD-check.yaml` matrix.
  backend:
    name: Live ${{ matrix.backend.name }}
    needs: [build, backend-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Generated by `generate-backend-matrix.R`, one entry per member of
        # `optional_backends()`, each carrying the packages to install, the
        # `required` list to declare, and its own `cache-version`. The job that
        # produced it writes it to the step summary, because this file no longer
        # shows it.
        backend: ${{ fromJSON(needs.backend-matrix.outputs.backend) }}

    env:
      # Turns an absent backend into a failure, so this job cannot pass while
      # skipping the very tests it exists to run.
      MARGINPLYR_REQUIRED_SUGGESTS: ${{ matrix.backend.required }}
      # testthat skips snapshot expectations under CRAN semantics, which marks
      # the whole test skipped. These jobs prove behavior rather than emulate
      # CRAN, so they opt out; the `depends-only` and `tarball` jobs
      # deliberately do not. Dropping this no longer merely weakens the job:
      # `verify-backend.R` refuses an "On CRAN" skip, because it is not a
      # backend this job withheld.
      NOT_CRAN: true
      # Every other optional backend is absent on purpose: proving one backend
      # in isolation also proves it does not depend on the others. That second
      # half is only worth stating because `check-tarball.R` enforces it; a
      # `backend` job that could see the rest would still prove its own
      # contracts and prove nothing about independence.
      _R_CHECK_FORCE_SUGGESTS_: false
      # Vignette rebuilding is covered by `depends-only` and `tarball`. Leaving
      # it out here keeps the job's toolchain to what the backend contract
      # needs, and keeps what a failure means unambiguous.
      MARGINPLYR_CHECK_ARGS: --as-cran --ignore-vignettes
      MARGINPLYR_CHECK_LABEL: Live ${{ matrix.backend.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::rcmdcheck, any::testthat, ${{ matrix.backend.packages }}
          # One cache per backend, derived alongside the rest of the entry so
          # that a new backend cannot arrive sharing another's library. These
          # jobs share an operating system, R version, and architecture, so a
          # single `cache-version` would put every library behind one
          # `restore-keys` prefix and each job would start from whichever ran
          # last (#64).
          cache-version: ${{ matrix.backend.cache }}

      - uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: tarball

      - name: Check the tarball with ${{ matrix.backend.name }} installed
        run: Rscript .github/scripts/check-tarball.R

      # Reads the check's own testthat log and fails unless the suite started,
      # passed something, failed nothing, and skipped nothing for a reason
      # other than a backend this job withheld. Runs even after a failed check,
      # because "what did this run actually execute" is the answer the job
      # exists to give.
      - name: Verify the live ${{ matrix.backend.name }} run was sound
        if: always()
        run: Rscript .github/scripts/verify-backend.R

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-backend-${{ matrix.backend.name }}
          path: check
          retention-days: 7
