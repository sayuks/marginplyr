name: PostgreSQL share transactions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: margin774
          POSTGRES_PASSWORD: margin774
          POSTGRES_DB: margin774
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U margin774"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: margin774
      PGPASSWORD: margin774
      PGDATABASE: margin774
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::RPostgres, local::.
          cache-version: postgres-transactions-1
      - name: Verify public transaction preservation in fresh processes
        run: Rscript tools/postgres-share-transactions.R postgres-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-transaction-evidence
          path: postgres-evidence/
          retention-days: 7
