# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Here rather than in a workflow of its own because it is repository hygiene
  # on the same trigger, and beside `lint` rather than inside it because it
  # needs no package installed: a byte count over `CLAUDE.md`'s closure runs on
  # a bare R, so it reports before the dependency install that job waits on.
  context-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - name: Verify the always-loaded context is within its baseline
        run: Rscript .github/scripts/verify-context-budget.R

  # Beside `context-budget` and for its reason: repository hygiene on the same
  # trigger, needing no package installed. A grep for a name a document cites
  # is what makes the name fail loudly, and until this step nothing ran one.
  doc-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - name: Verify every path a maintained document names exists
        run: Rscript .github/scripts/verify-doc-references.R

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::pkgload, local::.
          needs: lint

      # `object_usage_linter()` resolves symbols through the package namespace,
      # so linting a package that is not loaded reports every internal function
      # as an undefined global. Load first, and run the same two lines locally.
      - name: Lint
        run: |
          pkgload::load_all(".", quiet = TRUE)
          lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
