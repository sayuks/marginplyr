# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # These checks need only base R and git; each keeps its own failure outcome.
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        id: setup-r

      - name: Verify the always-loaded context is within its baseline
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-context-budget.R

      - name: Verify every path a maintained document names exists
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-doc-references.R

      - name: Verify the project-scoped Codex configuration
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-codex-config.R

      - name: Verify the agent sandbox network policy
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-agent-network-policy.R

      - name: Verify the local CRAN preflight contract
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-cran-preflight.R

      - name: Verify the CRAN release helper contract
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-cran-release.R

      - name: Verify the review-ready check contract
        if: ${{ !cancelled() && steps.setup-r.outcome == 'success' }}
        run: Rscript .github/scripts/verify-review-ready-check.R

  lint:
    # Review-ready process contracts target the maintainer's Mac workflow.
    runs-on: macos-latest
    # Includes R and dependency setup before either linter can run.
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      # Match R-CMD-check.yaml's macOS binary preinstall before pak resolution.
      - name: Preinstall Zstandard-compressed macOS dependencies
        run: |
          install.packages(
            c("knitr", "xfun"),
            dependencies = NA,
            type = "binary"
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::pkgload, any::spelling, local::., any::testthat, any::yaml, any::jsonlite, any::processx, any::ps, any::filelock, any::R6, any::rcmdcheck, any::roxygen2, any::digest
          needs: lint

      - name: Verify committed test priority registration
        run: Rscript tools/verify-test-priority.R

      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX

      - name: Verify suite-coverage worker execution
        run: Rscript tools/test-suite-coverage-workers.R

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install workflow syntax checker
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Verify CI artifacts and their command fixtures
        run: |
          Rscript tools/verify-ci-artifacts.R
          Rscript tools/test-ci-artifacts.R
          Rscript tools/test-ci-queue.R
          Rscript tools/test-interruption-supervisors.R

      - name: Verify R runner process contracts
        run: Rscript tools/test-review-ready-runner.R

      - name: Verify Review-ready progress and worker diagnostics
        run: Rscript tools/test-review-ready-progress.R

      - name: Verify local test priority proposals
        run: Rscript tools/test-review-ready-priority.R

      # Jarl complements rather than replaces lintr. Package-specific rules
      # need R and installed packages, so this reuses the dependency environment
      # instead of duplicating it in a separate job. The action and binary are
      # pinned independently. `AGENTS.md` owns the matching local procedure;
      # `jarl.toml` owns the repository-wide rule selection.
      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          version: "0.6.0"

      - name: Spell-check package
        run: |
          findings <- spelling::spell_check_package('.', vignettes = TRUE, use_wordlist = TRUE)
          if (nrow(findings)) { print(findings); stop('Package spelling found unknown words.', call. = FALSE) }
        shell: Rscript {0}

      # `object_usage_linter()` resolves symbols through the package namespace,
      # so linting a package that is not loaded reports every internal function
      # as an undefined global. Installing the package is not enough: load it
      # first, and run the same two lines locally.
      - name: Lint
        run: |
          pkgload::load_all(".", quiet = TRUE)
          lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
