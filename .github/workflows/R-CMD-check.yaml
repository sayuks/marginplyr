# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      # R-devel is covered by two jobs answering different questions, and the
      # gate is not this one. The R-devel compatibility gate is
      # `release-matrix.yaml`'s `tarball` job on `ubuntu-latest` / `r: devel`,
      # which installs hard dependencies plus rcmdcheck, testthat, and quarto
      # and checks the artifact a submission would carry. That job builds all
      # of that from source on R-devel and needs no workaround, because the two
      # packages whose source builds are prohibitive are arrow and duckdb, and
      # they are Suggests it never requests -- which its own
      # `verify-library-isolation.R` step asserts rather than assumes. Until
      # #64 gave the two workflows separate `cache-version` values that did not
      # hold: the tarball job restored this matrix's provisioned library by
      # `restore-keys` prefix and received arrow and duckdb along with it. The
      # question left over -- do the backend paths work on R-devel? -- is what
      # the steps below add on top of it. A failure here, in particular a P3M
      # outage, is not by itself an R-devel compatibility break.
      #
      # Source-building the backends is rejected, not merely avoided. A
      # hosted-runner measurement recorded in
      # `investigation/github-actions-modernization.md` compiled the full
      # Suggests set on R-devel for over 55 minutes and was still building
      # arrow when the job was stopped -- past the `timeout-minutes: 60` set
      # above. Whether arrow and duckdb build from source under R-devel is
      # their maintainers' and CRAN's question, not this package's: when a
      # CRAN r-devel flavor lacks them the tests skip, and
      # `release-matrix.yaml`'s `depends-only` job already proves skipping is
      # safe.
      #
      # P3M does not publish binaries for the development R series, so base R
      # installs binaries built for the compatible release series instead.
      # That they load under R-devel at all rests on one undocumented value.
      # `R_INTERNALS_UUID`, a compile-time constant in R's private
      # `src/include/Defn.h`, has been identical across R-4-2 through R-4-6
      # and trunk; `loadNamespace()` compares it against the installed
      # package's `Meta/features.rds` and stops when they differ. So the day
      # R-devel bumps it, this job fails with a clean error naming arrow or
      # duckdb rather than a crash. That clean failure is a convention R's
      # developers keep, not a guarantee: an internals change shipped without
      # a bump passes the guard and has no defined symptom. The bump has no
      # announcement channel and no deprecation path; see
      # `investigation/r-devel-binary-compatibility.md` for the evidence, and
      # #57 for why dropping the backends from this job is the intended
      # response rather than reverting to source builds.
      #
      # Preinstall all check dependencies so pak does not rebuild them for
      # R-devel.
      - name: Install P3M binary dependencies for R-devel
        if: matrix.config.r == 'devel'
        run: |
          user_agent <- getOption("HTTPUserAgent")
          match <- regexec("R [(]([0-9]+[.][0-9]+)[.]", user_agent)
          release <- regmatches(user_agent, match)[[1]][2]
          if (is.na(release) || !grepl("^[0-9]+[.][0-9]+$", release)) {
            stop("Could not derive the release R series from: ", user_agent)
          }
          # setup-r selects the P3M repository for the runner's Linux
          # distribution and architecture (for example noble or resolute).
          p3m <- Sys.getenv("RSPM")
          p3m_prefix <- "https://packagemanager.posit.co/cran/__linux__/"
          if (!nzchar(p3m) || !startsWith(p3m, p3m_prefix)) {
            stop("setup-r did not configure a supported P3M repository: ", p3m)
          }
          variables <- c(
            PKG_R_VERSIONS = release,
            PKG_CRAN_MIRROR = p3m,
            RENV_CONFIG_REPOS_OVERRIDE = p3m
          )
          write(
            paste(names(variables), variables, sep = "="),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )
          message("Using P3M binary repository: ", p3m)

          description <- read.dcf("DESCRIPTION")
          fields <- intersect(
            c("Depends", "Imports", "Suggests", "LinkingTo"),
            colnames(description)
          )
          references <- unlist(strsplit(
            paste(description[1, fields], collapse = ","),
            ",",
            fixed = TRUE
          ))
          dependencies <- trimws(sub(" *[(].*[)] *$", "", references))
          bundled <- rownames(installed.packages(
            priority = c("base", "recommended")
          ))
          dependencies <- sort(unique(setdiff(
            c(dependencies, "rcmdcheck"),
            c("", "R", bundled)
          )))
          message("Installing P3M binaries: ", paste(dependencies, collapse = ", "))
          install.packages(dependencies, repos = p3m, dependencies = NA)

          # When a binary is unavailable P3M serves source instead, silently
          # and without an error, so a successful install proves nothing on
          # its own. `Built` is the only field that separates a served release
          # binary from a source build that happened to compile.
          packages <- c("arrow", "duckdb")
          built <- vapply(
            packages,
            packageDescription,
            FUN.VALUE = character(1),
            fields = "Built"
          )
          print(data.frame(package = packages, built = unname(built)))
          expected <- paste0("R ", release, ".")
          if (!all(startsWith(built, expected))) {
            stop("P3M did not serve release binaries for Arrow and DuckDB")
          }
        shell: Rscript {0}

      - name: Install full dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Quarto renders vignettes in a child R process. On Windows, that
          # process cannot see R CMD build's temporary package installation,
          # so install the package itself first, as quarto-r's CI does.
          extra-packages: any::rcmdcheck, local::.
          needs: check
          # This matrix is the provisioned one, so it shares the `full-1` cache
          # with `release-matrix.yaml`'s `build` job and with nothing else. The
          # naming scheme, and why a shared `cache-version` broke the release
          # matrix, are recorded in that workflow's header.
          cache-version: full-1

      # Repeats the `Built` assertion after pak has run, because pak resolves
      # against the running R-devel series and a source build it chose would
      # replace the binaries installed above. This is a supply-chain check,
      # and the load check below does not replace it: a source build on
      # R-devel loads perfectly and passes any load check while being exactly
      # the hour-long, unexplained timeout this job exists to avoid. It is
      # also the likelier of the two to fire, since P3M's source fallback is
      # routine documented behavior whereas the internals UUID has not moved
      # in four years.
      - name: Verify P3M binary backends on R-devel
        if: matrix.config.r == 'devel'
        run: |
          packages <- c("arrow", "duckdb")
          built <- vapply(
            packages,
            packageDescription,
            FUN.VALUE = character(1),
            fields = "Built"
          )
          print(data.frame(package = packages, built = unname(built)))
          expected <- paste0("R ", Sys.getenv("PKG_R_VERSIONS"), ".")
          if (!all(startsWith(built, expected))) {
            stop("Arrow and DuckDB were not installed from P3M release binaries")
          }
        shell: Rscript {0}

      # This adds no coverage. `R CMD check` below already loads both packages
      # through the backend tests and would trip the same `loadNamespace()`
      # guard unaided. The step is here for diagnosis speed: it turns a
      # binary-incompatibility failure buried in the check log into an
      # immediate one that names the package and the cause, instead of a test
      # error that reads like a marginplyr bug.
      - name: Load the P3M binary backends on R-devel
        if: matrix.config.r == 'devel'
        run: |
          # The internals-UUID comparison lives in `loadNamespace()`, not in
          # `library()`, so every load path trips it; `library()` is simply
          # the shortest one to write.
          library(arrow)
          library(duckdb)
          message("Loaded arrow and duckdb under ", R.version.string)
        shell: Rscript {0}

      # No `upload-snapshots` here, and no `NOT_CRAN`. This matrix emulates
      # CRAN, and testthat skips snapshot expectations under CRAN semantics, so
      # all three snapshot-bearing tests skip and there is never a snapshot to
      # upload. Asking for one implied a coverage this job does not have.
      #
      # Snapshots run in `release-matrix.yaml`'s `backend` jobs, which set
      # `NOT_CRAN` because they prove behavior rather than emulate CRAN, and
      # whose uploaded check directory carries any `.new.md` diff. Keeping them
      # to those jobs is deliberate: #23 holds snapshots to diagnostic meaning
      # rather than byte-for-byte wording, and comparing five platforms' error
      # text would fail on formatting that was never a promise.
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # Uploaded for successful runs too, not just failures. A NOTE that
          # only appears on a green run is exactly the one nobody reads, and
          # the release review has to account for every NOTE.
          upload-results: true

      # Puts the status line and the full text of every ERROR, WARNING, and
      # NOTE on the run page, so auditing them does not require downloading
      # and unzipping the check directory.
      - name: Summarize the check log
        if: always()
        run: Rscript .github/scripts/summarize-check-log.R
        env:
          MARGINPLYR_CHECK_LABEL: >-
            ${{ matrix.config.os }} (${{ matrix.config.r }})
