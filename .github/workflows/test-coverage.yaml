# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# PR coverage is visible but optional for merging; the main-push result and
# Codecov report remain release evidence for the exact candidate SHA (ADR 0030).
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The suite under covr outgrew one job's 360-minute ceiling, so each leg
  # measures every N-th test file and test-coverage merges the legs' results.
  # covr also observes testthat's parallel workers
  # (investigation/2026-11-17-covr-shards-and-parallel-workers.md), but those
  # are capped by one runner's CPUs, while legs grow with the matrix.
  shard:
    name: test-coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Includes dependency setup and this leg's part of the suite under covr.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::yaml
          needs: coverage

      - name: Provision DuckDB JSON extension
        run: Rscript .github/scripts/provision-duckdb-json.R

      - name: Verify coverage exclusion policy
        run: Rscript .github/scripts/verify-coverage-policy.R

      - name: Test coverage shard
        run: >-
          Rscript tools/coverage-check.R
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --output coverage-shard-${{ matrix.shard }}.rds

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.rds
          retention-days: 7
          if-no-files-found: error

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures-${{ matrix.shard }}
          path: ${{ runner.temp }}/package
          retention-days: 7

  # Runs after a failed leg too, so a missing shard result fails here rather
  # than leaving the verdict skipped.
  test-coverage:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::covr, any::testthat, any::xml2, any::yaml

      - name: Verify coverage shard fixtures
        run: Rscript tools/test-coverage-shards.R

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Test coverage
        run: Rscript tools/coverage-check.R --merge coverage-shards --cobertura cobertura.xml

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ always() && hashFiles('cobertura.xml') != '' }}
        with:
          # Fork PR uploads are auxiliary when Codecov cannot authenticate them.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || secrets.CODECOV_TOKEN != '' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml
          retention-days: 7
