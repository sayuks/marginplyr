name: DuckDB JSON native diagnosis
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: install.packages(c("DBI", "duckdb", "processx"))
        shell: Rscript {0}
      - run: Rscript tools/diagnose-duckdb-json.R
