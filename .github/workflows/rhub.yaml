# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

# Quarto renders vignettes in a child R process. Install the package itself so
# that process can load marginplyr while R CMD build creates the vignettes.
env:
  RHUB_ACTIONS_INSTALL_LOCAL_PACKAGE: true

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Local customization: rhub::rhub_setup() generates the surrounding
      # workflow. This installation is portable across the supported Linux
      # containers.
      - name: Install portable Quarto from the official tarball
        shell: bash
        run: |
          set -euo pipefail
          quarto_machine="$(uname -m)"
          case "$quarto_machine" in
            x86_64 | amd64)
              quarto_arch=amd64
              ;;
            aarch64 | arm64)
              quarto_arch=arm64
              ;;
            *)
              echo "::error::Unsupported architecture for Quarto: $quarto_machine" >&2
              exit 1
              ;;
          esac

          quarto_dir="$(mktemp -d)"
          quarto_archive="$quarto_dir/quarto.tar.gz"
          curl --fail --location --show-error --silent \
            "https://quarto.org/download/latest/quarto-linux-${quarto_arch}.tar.gz" \
            --output "$quarto_archive"
          tar -xzf "$quarto_archive" -C "$quarto_dir"
          quarto_executable="$(find "$quarto_dir" -type f -path '*/bin/quarto' -print -quit)"
          if [ -z "$quarto_executable" ]; then
            echo "::error::Quarto archive did not contain an executable." >&2
            exit 1
          fi
          quarto_bin_dir="$(dirname "$quarto_executable")"
          printf '%s\n' "$quarto_bin_dir" >> "$GITHUB_PATH"
          export PATH="$quarto_bin_dir:$PATH"
          command -v quarto
          quarto --version
          quarto pandoc --version
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      # r-hub's dependency action installs the R package but not the Quarto
      # CLI required by this package's quarto::html vignette engine.
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
