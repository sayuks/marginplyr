# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: altdoc

permissions:
  contents: read
  pages: read

jobs:
  altdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: altdoc-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          # altdoc is declared in DESCRIPTION's `Config/Needs/website` rather
          # than in Suggests, because nothing outside `.Rbuildignore`d paths
          # uses it, so a Suggests entry installed a dependency closure for a
          # package the tarball never mentions (#113).
          #
          # That is not a weaker home: pak resolves this field, and it parses
          # and enforces a version constraint written here, so a floor moved
          # across loses nothing. Nothing in this repository fails if that
          # stops holding -- a dropped constraint silently installs an older
          # altdoc -- so re-check it rather than assume it. Put an
          # unsatisfiable constraint in the field of a throwaway package and
          # resolve it with `pak::pkg_deps("local::<pkg>", dependencies =
          # list(direct = "Config/Needs/website", indirect =
          # "Config/Needs/website"))`; it must fail naming the constraint, not
          # resolve.
          needs: website

      # Before the render rather than after it. A `must_error` option that
      # stopped asserting anything reports nothing, so the site it produces
      # looks exactly like a correct one; failing here says which half broke.
      - name: Verify the must_error chunk option
        run: Rscript .github/scripts/verify-must-error.R

      - name: Build site
        run: |
          altdoc::render_docs(parallel = FALSE, freeze = FALSE)
        shell: Rscript {0}

      - name: Verify site output
        run: Rscript .github/scripts/verify-site.R

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: altdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
